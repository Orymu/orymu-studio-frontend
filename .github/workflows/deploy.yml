name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  DEPLOY_PATH: /opt/orymu-studio

jobs:
  deploy_static_site:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static output
        run: pnpm build

      - name: Ensure static output exists
        run: |
          set -euo pipefail
          if [ ! -d out ]; then
            echo "Missing out/ directory. Verify next.config.ts uses output: 'export'."
            exit 1
          fi

      - name: Validate required secrets
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_APP_DOMAIN: ${{ secrets.PRODUCTION_APP_DOMAIN }}
          PRODUCTION_ACME_EMAIL: ${{ secrets.PRODUCTION_ACME_EMAIL }}
        run: |
          set -euo pipefail
          missing=0
          for name in PRODUCTION_SSH_HOST PRODUCTION_SSH_USER PRODUCTION_SSH_KEY PRODUCTION_APP_DOMAIN PRODUCTION_ACME_EMAIL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add droplet to known hosts
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh_port="${PRODUCTION_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$ssh_port" -H "$PRODUCTION_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync deployment assets
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_port="${PRODUCTION_SSH_PORT:-22}"
          tar -C deploy -czf - . | ssh -p "$ssh_port" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "set -euo pipefail; mkdir -p '$DEPLOY_PATH'; tar -xzf - -C '$DEPLOY_PATH'"

      - name: Upload static bundle
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_port="${PRODUCTION_SSH_PORT:-22}"
          tar -C out -czf - . | ssh -p "$ssh_port" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "set -euo pipefail; rm -rf '$DEPLOY_PATH/site_next'; mkdir -p '$DEPLOY_PATH/site_next'; tar -xzf - -C '$DEPLOY_PATH/site_next'"

      - name: Deploy on droplet
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_APP_DOMAIN: ${{ secrets.PRODUCTION_APP_DOMAIN }}
          PRODUCTION_ACME_EMAIL: ${{ secrets.PRODUCTION_ACME_EMAIL }}
        run: |
          set -euo pipefail
          ssh_port="${PRODUCTION_SSH_PORT:-22}"

          app_domain_escaped="$(printf '%q' "$PRODUCTION_APP_DOMAIN")"
          acme_email_escaped="$(printf '%q' "$PRODUCTION_ACME_EMAIL")"

          ssh -p "$ssh_port" "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" \
            "set -euo pipefail; \
             cd '$DEPLOY_PATH'; \
             APP_DOMAIN=$app_domain_escaped \
             ACME_EMAIL=$acme_email_escaped \
             bash scripts/deploy.sh"

      - name: Deployment summary
        run: |
          echo "Deployed static site to $DEPLOY_PATH/site" >> "$GITHUB_STEP_SUMMARY"
          echo "Domain: ${{ secrets.PRODUCTION_APP_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
